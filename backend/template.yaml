AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Aventon Mayab - Lambda functions with the business rules

Parameters:
  UserPoolId:
    Type: String
    Description: Cognito User Pool ID (output of the aventon-mayab-auth stack)
  UserPoolClientId:
    Type: String
    Description: Cognito App Client ID (output of the aventon-mayab-auth stack)
  AllowedOrigins:
    Type: CommaDelimitedList
    Default: "*"
    Description: Frontend origins allowed by CORS, e.g. https://my-app.vercel.app,http://localhost:3000
  ScheduleModelId:
    Type: String
    Default: anthropic.claude-opus-5-5
    Description: Claude model in Amazon Bedrock that reads uploaded timetables

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures:
      - arm64
    CodeUri: src
    MemorySize: 256
    Timeout: 10
    Environment:
      Variables:
        USERS_TABLE: aventon-users
        TRIPS_TABLE: aventon-trips
        SEAT_REQUESTS_TABLE: aventon-seat-requests
        PARKING_ZONES_TABLE: aventon-parking-zones
        PARKING_SESSIONS_TABLE: aventon-parking-sessions
        SCHEDULES_TABLE: aventon-schedules

Resources:
  # Every route requires a valid Cognito token; the student's ID comes from it.
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Auth:
        DefaultAuthorizer: CognitoJwt
        Authorizers:
          CognitoJwt:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPoolId}
              audience:
                - !Ref UserPoolClientId
      CorsConfiguration:
        AllowOrigins: !Ref AllowedOrigins
        AllowHeaders:
          - authorization
          - content-type
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
        MaxAge: 600
      # Caps requests per second so a bug or abuse can't run up the bill.
      DefaultRouteSettings:
        ThrottlingRateLimit: 50
        ThrottlingBurstLimit: 100

  TripsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: aventon-trips
      Handler: trips.handler
      Events:
        ListTrips: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Method: GET, Path: /trips } }
        CreateTrip: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Method: POST, Path: /trips } }
        GetTrip: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Method: GET, Path: "/trips/{tripId}" } }
        MyTrips: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Method: GET, Path: /me/trips } }
        RequestSeat: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Method: POST, Path: "/trips/{tripId}/requests" } }
        CancelRequest: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Method: DELETE, Path: "/trips/{tripId}/requests" } }
        AcceptRequest: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Method: POST, Path: "/trips/{tripId}/requests/{passengerId}/accept" } }
        RejectRequest: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Method: POST, Path: "/trips/{tripId}/requests/{passengerId}/reject" } }
        SetMeetingPoint: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Method: PUT, Path: "/trips/{tripId}/meeting-point" } }
        SetTripStatus: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Method: POST, Path: "/trips/{tripId}/status" } }
      Policies:
        - DynamoDBCrudPolicy:
            TableName: aventon-trips
        - DynamoDBCrudPolicy:
            TableName: aventon-seat-requests
        - DynamoDBReadPolicy:
            TableName: aventon-users

  ParkingFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: aventon-parking
      Handler: parking.handler
      Events:
        ListZones: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Method: GET, Path: /parking/zones } }
        MySession: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Method: GET, Path: /parking/session } }
        Entry: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Method: POST, Path: /parking/entry } }
        Exit: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Method: POST, Path: /parking/exit } }
        Presence: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Method: GET, Path: /parking/presence } }
        SensorEvent: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Method: POST, Path: /parking/sensor-events } }
        SensorOnline: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Method: POST, Path: "/parking/zones/{zoneId}/sensor" } }
        ResetDemo: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Method: POST, Path: /parking/demo/reset } }
      Policies:
        - DynamoDBCrudPolicy:
            TableName: aventon-parking-zones
        - DynamoDBCrudPolicy:
            TableName: aventon-parking-sessions
        # Only to count, per time slot, how many students have class (forecasts).
        - DynamoDBReadPolicy:
            TableName: aventon-schedules

  ProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: aventon-profile
      Handler: profile.handler
      Timeout: 30
      Environment:
        Variables:
          USER_POOL_ID: !Ref UserPoolId
      Events:
        GetProfile: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Method: GET, Path: /me } }
        SaveProfile: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Method: PUT, Path: /me } }
        DeleteAccount: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Method: DELETE, Path: /me } }
        GetSchedule: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Method: GET, Path: /me/schedule } }
        SaveSlot: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Method: PUT, Path: "/me/schedule/{slotId}" } }
        DeleteSlot: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Method: DELETE, Path: "/me/schedule/{slotId}" } }
      Policies:
        - DynamoDBCrudPolicy:
            TableName: aventon-users
        - DynamoDBCrudPolicy:
            TableName: aventon-schedules
        - DynamoDBCrudPolicy:
            TableName: aventon-trips
        - DynamoDBCrudPolicy:
            TableName: aventon-seat-requests
        - DynamoDBCrudPolicy:
            TableName: aventon-parking-zones
        - DynamoDBCrudPolicy:
            TableName: aventon-parking-sessions
        - Statement:
            - Effect: Allow
              Action: cognito-idp:AdminDeleteUser
              Resource: !Sub arn:${AWS::Partition}:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${UserPoolId}

  # Reads a timetable photo or PDF with Claude in Amazon Bedrock. Nothing is stored.
  ScheduleImportFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: aventon-schedule-import
      Handler: schedule-import.handler
      # API Gateway answers 503 after 30 s, so Claude gets 25 s.
      Timeout: 29
      MemorySize: 512
      Environment:
        Variables:
          MODEL_ID: !Ref ScheduleModelId
      Events:
        ImportSchedule: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Method: POST, Path: /me/schedule/import } }
      Policies:
        - Statement:
            - Effect: Allow
              Action: bedrock-mantle:CreateInference
              Resource: "*"

Outputs:
  ApiUrl:
    Description: NEXT_PUBLIC_API_URL for the frontend
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
  TripsFunctionArn:
    Value: !GetAtt TripsFunction.Arn
  ParkingFunctionArn:
    Value: !GetAtt ParkingFunction.Arn
  ProfileFunctionArn:
    Value: !GetAtt ProfileFunction.Arn
  ScheduleImportFunctionArn:
    Value: !GetAtt ScheduleImportFunction.Arn
