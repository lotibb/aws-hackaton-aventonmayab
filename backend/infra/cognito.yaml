AWSTemplateFormatVersion: "2010-09-09"
Description: Aventon Mayab - Cognito login (User Pool, web App Client, @anahuac.mx sign-up check)

Parameters:
  AllowedEmailDomain:
    Type: String
    Default: anahuac.mx
    Description: Only emails ending in @<this domain> can create an account

Resources:
  # Runs before any account is created and rejects non-Anahuac emails.
  PreSignUpFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: aventon-mayab-pre-signup
      Runtime: nodejs22.x
      Handler: index.handler
      Timeout: 5
      Role: !GetAtt PreSignUpRole.Arn
      Environment:
        Variables:
          ALLOWED_DOMAIN: !Ref AllowedEmailDomain
      Code:
        ZipFile: |
          exports.handler = async (event) => {
            const domain = process.env.ALLOWED_DOMAIN.toLowerCase();
            const email = (event.request.userAttributes.email || "").trim().toLowerCase();
            if (!email.endsWith("@" + domain)) {
              throw new Error("Solo se permiten correos @" + domain);
            }
            return event;
          };

  PreSignUpRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  PreSignUpPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref PreSignUpFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt UserPool.Arn

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: aventon-mayab-users
      UsernameAttributes:
        - email
      UsernameConfiguration:
        CaseSensitive: false
      AutoVerifiedAttributes:
        - email
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
      # Relaxed on purpose for the demo.
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: false
          RequireUppercase: false
          RequireNumbers: false
          RequireSymbols: false
      VerificationMessageTemplate:
        DefaultEmailOption: CONFIRM_WITH_CODE
        EmailSubject: Tu código de Aventón Mayab
        EmailMessage: "Tu código de verificación es {####}"
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      LambdaConfig:
        PreSignUp: !GetAtt PreSignUpFunction.Arn

  # Browser app: no client secret.
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: aventon-mayab-web
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED

Outputs:
  Region:
    Value: !Ref AWS::Region
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  UserPoolArn:
    Description: Needed later for the API Gateway JWT authorizer
    Value: !GetAtt UserPool.Arn
